<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荃灣絲麗酒店 - 禮賓部員工後台</title>

    <!-- 引入 Firebase SDK (Compat 版本) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #eef2f7;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-card {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .login-card h2 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #343a40;
        }

        .login-card p {
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
        }

        .login-card input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            text-align: center;
        }

        .login-card button {
            width: 100%;
            padding: 10px;
            background: #343a40;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .error-msg {
            color: #dc3545;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: none;
        }

        .header {
            background: #343a40;
            color: #fff;
            padding: 20px;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        .header.alert-mode {
            background: #c0392b !important;
            animation: pulse-header 1.5s infinite;
        }

        @keyframes pulse-header {
            0% { opacity: 1; }
            50% { opacity: 0.85; }
            100% { opacity: 1; }
        }

        /* 🔵 藍色閃爍外框標籤 (請求通話) */
        .blue-req-tag {
            color: #0056b3;
            background: #e1f0ff;
            border: 1px solid #007bff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            animation: blueBlink 1.2s infinite;
        }

        @keyframes blueBlink {
            0% { opacity: 1; box-shadow: 0 0 2px #007bff; }
            50% { opacity: 0.3; box-shadow: none; }
            100% { opacity: 1; box-shadow: 0 0 2px #007bff; }
        }

        .header h1 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 12px;
            color: #adb5bd;
        }

        .section {
            padding: 20px;
            border-bottom: 1px solid #dee2e6;
        }

        .section:last-child {
            border-bottom: none;
        }

        h2 {
            font-size: 16px;
            color: #343a40;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-console {
            display: flex;
            height: 380px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            overflow: hidden;
            background: #f8f9fa;
        }

        .user-list {
            width: 220px;
            border-right: 1px solid #ced4da;
            background: #fff;
            overflow-y: auto;
        }

        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            font-size: 13px;
        }

        .user-item:hover {
            background: #eef2f7;
        }

        .user-item.active {
            background: #e2e8f0;
            font-weight: bold;
            border-left: 4px solid #2c3e50;
        }

        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: 13px;
            background: #fafafa;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ced4da;
            background: #fff;
        }

        .chat-input-area input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            outline: none;
        }

        .chat-input-area button {
            margin-left: 6px;
            padding: 8px 16px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .staff-bus-item {
            background: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
        }

        .staff-bus-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        .staff-btn {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-normal {
            background: #6c757d;
            color: white;
        }

        .btn-full {
            background: #dc3545;
            color: white;
        }

        .btn-out {
            background: #343a40;
            color: white;
        }

        .staff-btn.active {
            outline: 2px solid #000;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h2>職員身分驗證</h2>
            <p>荃灣絲麗酒店 - 禮賓部後台</p>
            <form id="loginForm" onsubmit="checkLogin(event)">
                <input type="text" id="usernameInput" placeholder="請輸入員工帳號" autocomplete="username" required>
                <input type="password" id="passwordInput" placeholder="請輸入員工密碼" autocomplete="current-password" required>
                <button type="submit">登入後台</button>
            </form>
            <div id="errorMsg" class="error-msg">帳號或密碼錯誤，請重新輸入！</div>
        </div>
    </div>

    <div class="container" id="mainContainer">
        <div class="header" id="mainHeader">
            <h1>荃灣絲麗酒店 - 禮賓部員工後台</h1>
            <p>Staff Management Console (Cloud Synced)</p>
        </div>

        <!-- 💬 一對多線上客服中控台 -->
        <div class="section">
            <h2>💬 即時線上客服（一對多）</h2>
            <div class="chat-console">
                <div class="user-list" id="userList">
                    <div style="padding: 12px; color: #888; font-size: 12px; text-align: center;">等待訪客連線...</div>
                </div>
                <div class="chat-window">
                    <div id="activeUserHeader"
                        style="padding: 10px; background: #eef2f7; font-size: 13px; font-weight: bold; border-bottom: 1px solid #ced4da; display: flex; justify-content: space-between; align-items: center;">
                        <span id="activeUserTitle">請選擇左側訪客進行對話</span>
                        
                        <div class="btn-group">
                            <!-- 階段 1：AI 智能對話中 -->
                            <span id="aiStatusTag" style="display: inline-block; background: #e9ecef; color: #495057; border: 1px solid #ced4da; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold;">
                                🤖 智能 AI 對話中 (無需接管)
                            </span>
                            <!-- 階段 2：確認接通服務 -->
                            <button id="acceptChatBtn" onclick="acceptHumanChat()"
                                style="display: none; background: #007bff; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">📞 確認接通服務</button>
                            <!-- 階段 3：結束對話 (交回AI) -->
                            <button id="endChatBtn" onclick="endHumanChat()"
                                style="display: none; background: #28a745; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">✅ 結束對話 (交回AI)</button>
                        </div>
                    </div>
                    <div class="chat-messages" id="staffChatMessages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="staffInput" placeholder="輸入回覆訊息..."
                            onkeypress="if(event.key==='Enter') sendStaffMessage()">
                        <button onclick="sendStaffMessage()">發送</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 🚌 穿梭巴士即時狀態管理 -->
        <div class="section">
            <h2>🚌 穿梭巴士即時狀態管理</h2>
            <div
                style="background: #fff; border: 1px solid #ced4da; border-radius: 8px; padding: 12px; margin-bottom: 16px; text-align: center;">
                <div style="font-weight: bold; margin-bottom: 8px; font-size: 14px;">📍 即時行車狀況（頂部 Banner 控制）</div>
                <button id="pauseToggleBtn" onclick="toggleStatusPause()"
                    style="width: 100%; padding: 10px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; background-color: #dc3545;">
                    ⏸️ 一鍵暫停全日服務（覆蓋即時狀況）
                </button>
            </div>
            <div id="staffBusList"></div>
        </div>
    </div>

    <script>
        // ==================== Firebase 配置 ====================
        const firebaseConfig = {
            databaseURL: "https://silkatw-a5cf1-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const CORRECT_USERNAME = "stwconciergestaff";
        const CORRECT_PASSWORD = "stw3824";
        let manualOverrides = {};
        let isLiveStatusPaused = false;
        let activeSessionId = null;
        let readStatus = {};

        // 🟢 Google 翻譯工具函數
        async function translateText(text, targetLang, sourceLang = 'auto') {
            if (!text || text.trim() === '') return text;
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                return data[0].map(item => item[0]).join('');
            } catch (e) {
                console.error("Translation error:", e);
                return text;
            }
        }

        // 頁面載入時：自動帶入上次記憶的帳號與密碼
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('savedUsername');
            const savedPass = localStorage.getItem('savedPassword');

            if (savedUser) document.getElementById('usernameInput').value = savedUser;
            if (savedPass) document.getElementById('passwordInput').value = savedPass;
        });

        // 登入驗證與記憶帳密
        function checkLogin(e) {
            if (e) e.preventDefault();
            const userVal = document.getElementById('usernameInput').value.trim();
            const passVal = document.getElementById('passwordInput').value.trim();

            if (userVal === CORRECT_USERNAME && passVal === CORRECT_PASSWORD) {
                localStorage.setItem('savedUsername', userVal);
                localStorage.setItem('savedPassword', passVal);

                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
                document.getElementById('errorMsg').style.display = 'none';
                renderStaffBusList();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        // 🟢 檢查對話紀錄中的最後真實狀態（支援 8 種語言多國關鍵字與原文比對）
        function parseRealSessionStatus(messages, currentDbStatus) {
            if (currentDbStatus === 'human') return 'human';

            let lastRealState = 'ai';
            messages.forEach(m => {
                if (m) {
                    const txt = m.message || '';
                    const origTxt = m.originalMessage || '';
                    const fullTxt = txt + ' ' + origTxt;

                    // 1. 判定請求真人
                    if (
                        fullTxt.includes('請求真人') || 
                        fullTxt.includes('轉接') || 
                        fullTxt.includes('⚠️') || 
                        fullTxt.includes('Human') || 
                        fullTxt.includes('assistance') ||
                        fullTxt.includes('상담원') ||
                        fullTxt.includes('オペレーター') ||
                        fullTxt.includes('nhân viên')
                    ) {
                        lastRealState = 'waiting';
                    } 
                    // 2. 判定專員已接通
                    else if (fullTxt.includes('專員已接通') || fullTxt.includes('Chuyên gia đã được kết nối')) {
                        lastRealState = 'human';
                    } 
                    // 3. 判定已結束對話（切換回 AI，涵蓋 8 種語言）
                    else if (
                        fullTxt.includes('結束對話') || 
                        fullTxt.includes('切換回 AI') || 
                        fullTxt.includes('結束服務') || 
                        fullTxt.includes('結束真人對話') ||
                        fullTxt.includes('chuyển về dịch vụ AI') ||
                        fullTxt.includes('switched back to AI') ||
                        fullTxt.includes('AIコンシェルジュに切り替え') ||
                        fullTxt.includes('AI 컨시어지로 전환') ||
                        fullTxt.includes('bumalik sa serbisyo ng AI') ||
                        fullTxt.includes('AI सेवा पर वापस')
                    ) {
                        lastRealState = 'ai';
                    }
                }
            });

            // 若資料庫記錄已設為 ai，優先以資料庫紀錄為主
            if (currentDbStatus === 'ai') return 'ai';

            return lastRealState;
        }

        // 🟢【即時監聽】訪客列表
        db.ref('chats').on('value', (snapshot) => {
            const chats = snapshot.val() || {};
            const userListEl = document.getElementById('userList');
            const headerEl = document.getElementById('mainHeader');
            if (!userListEl) return;

            db.ref('chatStatus').once('value', (statusSnap) => {
                const statuses = statusSnap.val() || {};
                userListEl.innerHTML = '';

                const sortedSessions = Object.keys(chats).map(sessionId => {
                    const messages = chats[sessionId] ? Object.values(chats[sessionId]) : [];
                    const lastMsg = messages[messages.length - 1] || {};
                    const dbStatus = statuses[sessionId] || 'ai';

                    const realStatus = parseRealSessionStatus(messages, dbStatus);

                    return {
                        sessionId: sessionId,
                        lastTimestamp: lastMsg.timestamp || 0,
                        lastSender: lastMsg.sender || '',
                        status: realStatus
                    };
                }).sort((a, b) => b.lastTimestamp - a.lastTimestamp);

                if (sortedSessions.length === 0) {
                    userListEl.innerHTML = '<div style="padding: 12px; color: #888; font-size: 12px; text-align: center;">暫無訪客連線</div>';
                    if (headerEl) {
                        headerEl.classList.remove('alert-mode');
                        document.title = "荃灣絲麗酒店 - 禮賓部員工後台";
                    }
                    return;
                }

                let hasAnyUnread = false;

                sortedSessions.forEach(item => {
                    const sessionId = item.sessionId;
                    const isCurrentActive = (sessionId === activeSessionId);

                    if (isCurrentActive) {
                        readStatus[sessionId] = item.lastTimestamp;
                    }

                    const hasUnread = (item.lastSender === 'guest') && (!readStatus[sessionId] || item.lastTimestamp > readStatus[sessionId]);

                    if (hasUnread) {
                        hasAnyUnread = true;
                    }

                    const isWaiting = (item.status === 'waiting');

                    const div = document.createElement('div');
                    div.className = 'user-item' + (isCurrentActive ? ' active' : '');

                    // 🟢 左邊顯示藍色閃爍外框 (請求通話) 標籤
                    div.innerHTML = `
                        <span>👤 訪客 (${sessionId.slice(-4)}) ${isWaiting ? '<span class="blue-req-tag">(請求通話)</span>' : ''}</span>
                        ${hasUnread ? '<span style="width: 8px; height: 8px; background-color: #dc3545; border-radius: 50%; display: inline-block;"></span>' : ''}
                    `;

                    div.onclick = () => selectUserSession(sessionId);
                    userListEl.appendChild(div);
                });

                if (headerEl) {
                    if (hasAnyUnread) {
                        headerEl.classList.add('alert-mode');
                        document.title = "【新訊息！🚨】荃灣絲麗酒店 - 禮賓部員工後台";
                    } else {
                        headerEl.classList.remove('alert-mode');
                        document.title = "荃灣絲麗酒店 - 禮賓部員工後台";
                    }
                }

                if (activeSessionId && chats[activeSessionId]) {
                    renderMessages(chats[activeSessionId]);
                }
            });
        });

        let currentStatusListener = null;

        function selectUserSession(sessionId) {
            activeSessionId = sessionId;
            document.getElementById('activeUserTitle').innerText = `正在與 訪客 (${sessionId.slice(-4)}) 對話`;

            if (currentStatusListener) {
                currentStatusListener.off();
            }

            const acceptBtn = document.getElementById('acceptChatBtn');
            const endBtn = document.getElementById('endChatBtn');
            const aiTag = document.getElementById('aiStatusTag');

            // 1. 讀取與更新狀態
            db.ref('chats/' + sessionId).once('value', (snapshot) => {
                const msgs = snapshot.val() || {};
                const msgArr = Object.values(msgs);
                if (msgArr.length > 0) {
                    readStatus[sessionId] = msgArr[msgArr.length - 1].timestamp || Date.now();
                }
                renderMessages(msgs);

                db.ref('chatStatus/' + sessionId).once('value', (snap) => {
                    const dbStatus = snap.val() || 'ai';
                    const realStatus = parseRealSessionStatus(msgArr, dbStatus);

                    updateHeaderButtons(realStatus);
                });
            });

            // 2. 即時監聽
            currentStatusListener = db.ref('chatStatus/' + sessionId);
            currentStatusListener.on('value', (snap) => {
                const dbStatus = snap.val() || 'ai';
                db.ref('chats/' + sessionId).once('value', (msgSnap) => {
                    const msgArr = Object.values(msgSnap.val() || {});
                    const realStatus = parseRealSessionStatus(msgArr, dbStatus);
                    updateHeaderButtons(realStatus);
                });
            });

            renderStaffBusList();
        }

        // 🟢 控制右上角三種按鈕切換的核心函數
        function updateHeaderButtons(status) {
            const acceptBtn = document.getElementById('acceptChatBtn');
            const endBtn = document.getElementById('endChatBtn');
            const aiTag = document.getElementById('aiStatusTag');

            if (status === 'waiting') {
                // 客要真人 ➔ 藍色 「📞 確認接通服務」 按鈕
                acceptBtn.style.display = 'inline-block';
                endBtn.style.display = 'none';
                aiTag.style.display = 'none';
            } else if (status === 'human') {
                // 專員已接通 ➔ 綠色 「✅ 結束對話 (交回AI)」 按鈕
                acceptBtn.style.display = 'none';
                endBtn.style.display = 'inline-block';
                aiTag.style.display = 'none';
            } else {
                // 平時（AI 處理中） ➔ 灰底 「🤖 智能 AI 對話中 (無需接管)」 標籤
                acceptBtn.style.display = 'none';
                endBtn.style.display = 'none';
                aiTag.style.display = 'inline-block';
            }
        }

        // 🟢 專員點擊「確認接通服務」（已加入自動翻譯）
        async function acceptHumanChat() {
            if (!activeSessionId) return;

            let guestLang = '';
            const langSnap = await db.ref('chatStatus/' + activeSessionId + '_lang').once('value');
            if (langSnap.exists() && langSnap.val()) {
                guestLang = langSnap.val();
            }

            const langMap = {
                'zh-HK': 'zh-TW', 'zh-CN': 'zh-CN', 'en': 'en',
                'ja': 'ja', 'ko': 'ko', 'vi': 'vi', 'hi': 'hi', 'fil': 'tl'
            };
            const targetLang = langMap[guestLang] || guestLang || 'zh-TW';

            const rawMsg = '【系統提示】專員已接通，目前正在進行真人通話中。';
            let translatedMsg = rawMsg;
            if (targetLang && !targetLang.startsWith('zh')) {
                translatedMsg = await translateText(rawMsg, targetLang, 'zh-TW');
            }

            db.ref('chatStatus/' + activeSessionId).set('human');
            db.ref('chats/' + activeSessionId).push({
                sender: 'staff',
                message: translatedMsg,
                originalMessage: rawMsg,
                timestamp: Date.now()
            });

            alert("已成功接通訪客！");
        }

        // 🟢 專員點擊「結束對話 (交回AI)」（已加入自動翻譯）
        async function endHumanChat() {
            if (!activeSessionId) return;

            let guestLang = '';
            const langSnap = await db.ref('chatStatus/' + activeSessionId + '_lang').once('value');
            if (langSnap.exists() && langSnap.val()) {
                guestLang = langSnap.val();
            }

            const langMap = {
                'zh-HK': 'zh-TW', 'zh-CN': 'zh-CN', 'en': 'en',
                'ja': 'ja', 'ko': 'ko', 'vi': 'vi', 'hi': 'hi', 'fil': 'tl'
            };
            const targetLang = langMap[guestLang] || guestLang || 'zh-TW';

            const rawMsg = '【系統提示】禮賓專員已結束服務，對話已切換回 AI 智能禮賓部。';
            let translatedMsg = rawMsg;
            if (targetLang && !targetLang.startsWith('zh')) {
                translatedMsg = await translateText(rawMsg, targetLang, 'zh-TW');
            }

            db.ref('chatStatus/' + activeSessionId).set('ai');
            db.ref('chats/' + activeSessionId).push({
                sender: 'staff',
                message: translatedMsg,
                originalMessage: rawMsg,
                timestamp: Date.now()
            });

            alert("已成功結束對話，已將該訪客交回 AI 接管！");
        }

        // 🟢 渲染對話紀錄
        async function renderMessages(msgObj) {
            const container = document.getElementById('staffChatMessages');
            if (!container) return;
            container.innerHTML = '';

            if (!msgObj) return;

            const entries = Object.entries(msgObj);

            let lastHumanReqIndex = -1;
            entries.forEach(([key, msg], idx) => {
                if (msg && msg.message) {
                    const txt = msg.message;
                    if (
                        txt.includes('請求真人') || 
                        txt.includes('轉接') || 
                        txt.includes('⚠️') || 
                        txt.includes('human') || 
                        txt.includes('Human') || 
                        txt.includes('assistance') ||
                        txt.includes('상담원') ||
                        txt.includes('オペレーター')
                    ) {
                        lastHumanReqIndex = idx;
                    }
                }
            });

            const targetEntries = lastHumanReqIndex !== -1 ? entries.slice(lastHumanReqIndex) : entries;

            for (const [key, msg] of targetEntries) {
                const align = msg.sender === 'staff' ? 'right' : 'left';
                const color = msg.sender === 'staff' ? '#2c3e50' : '#007bff';
                const senderName = msg.sender === 'staff' ? '禮賓專員' : '訪客';

                const dateObj = msg.timestamp ? new Date(msg.timestamp) : new Date();
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const day = String(dateObj.getDate()).padStart(2, '0');
                const hours = String(dateObj.getHours()).padStart(2, '0');
                const minutes = String(dateObj.getMinutes()).padStart(2, '0');
                const timeStr = `${month}/${day} ${hours}:${minutes}`;

                let displayMsg = msg.message;

                if (msg.sender === 'guest' && !msg.message.includes('⚠️')) {
                    const translatedText = await translateText(msg.message, 'zh-TW');
                    displayMsg = `<div>${translatedText}</div><div style="font-size:11px; color:#888; margin-top:2px;">🌐 原文：${msg.message}</div>`;
                }

                container.innerHTML += `
                    <div style="margin-bottom: 10px; text-align: ${align};">
                        <span style="font-weight: bold; color: ${color}; font-size: 12px;">${senderName}</span>
                        <span style="font-size: 10px; color: #888; margin: 0 4px;">${timeStr}</span>
                        <div style="color: #333; margin-top: 2px;">${displayMsg}</div>
                    </div>`;
            }
            container.scrollTop = container.scrollHeight;
        }

        // 🟢 Staff 發送訊息
        async function sendStaffMessage() {
            const input = document.getElementById('staffInput');
            const text = input.value.trim();
            if (!text || !activeSessionId) return;

            let guestLang = '';
            const langSnap = await db.ref('chatStatus/' + activeSessionId + '_lang').once('value');
            if (langSnap.exists() && langSnap.val()) {
                guestLang = langSnap.val();
            }

            const langMap = {
                'zh-HK': 'zh-TW',
                'zh-CN': 'zh-CN',
                'en': 'en',
                'ja': 'ja',
                'ko': 'ko',
                'vi': 'vi',
                'hi': 'hi',
                'fil': 'tl'
            };

            const targetLang = langMap[guestLang] || guestLang || 'zh-TW';

            let finalMsg = text;
            if (targetLang && !targetLang.startsWith('zh')) {
                finalMsg = await translateText(text, targetLang, 'zh-TW');
            }

            db.ref('chats/' + activeSessionId).push({
                sender: 'staff',
                message: finalMsg,
                originalMessage: text,
                timestamp: Date.now()
            });

            input.value = '';
        }

        db.ref('busManualOverrides').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            manualOverrides = data;
            isLiveStatusPaused = !!data.isLiveStatusPaused;

            updatePauseButtonUI();
            renderStaffBusList();
        });

        function toggleStatusPause() {
            const newPauseState = !isLiveStatusPaused;
            db.ref('busManualOverrides/isLiveStatusPaused').set(newPauseState);
        }

        function updatePauseButtonUI() {
            const btn = document.getElementById('pauseToggleBtn');
            if (!btn) return;

            if (isLiveStatusPaused) {
                btn.innerText = "▶️ 恢復自動即時行車狀況";
                btn.style.backgroundColor = "#28a745";
            } else {
                btn.innerText = "⏸️ 一鍵暫停全日服務（覆蓋即時狀況）";
                btn.style.backgroundColor = "#dc3545";
            }
        }

        const rawBusData = [
            { id: 1, hotel: "08:00", kMin: "08:15", tMin: "08:30" },
            { id: 2, hotel: "09:00", kMin: "09:15", tMin: "09:30" },
            { id: 3, hotel: "10:00", kMin: "10:15", tMin: "10:30" },
            { id: 4, hotel: "11:00", kMin: "11:15", tMin: "11:30" },
            { id: 5, hotel: "12:00", kMin: "12:15", tMin: "12:30" },
            { id: 6, hotel: "13:00", isBreak: true },
            { id: 7, hotel: "14:00", kMin: "14:15", tMin: "14:30" },
            { id: 8, hotel: "15:00", kMin: "15:15", tMin: "15:30" },
            { id: 9, hotel: "16:00", kMin: "16:15", tMin: "16:30" },
            { id: 10, hotel: "17:00", kMin: "17:15", tMin: "17:30" },
            { id: 11, hotel: "18:00", kMin: "18:15", tMin: "18:30" },
            { id: 12, hotel: "19:00", kMin: "19:15", tMin: "19:30" },
            { id: 13, hotel: "20:00", kMin: "20:15", tMin: "20:30" }
        ];

        function renderStaffBusList() {
            const container = document.getElementById('staffBusList');
            if (!container) return;
            container.innerHTML = '';

            rawBusData.forEach(item => {
                if (item.isBreak) {
                    container.innerHTML += `<div style="background: #fff3cd; color: #856404; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 12px; text-align: center;">🍽️ ${item.hotel} : 午飯時間 (暫停服務)</div>`;
                } else {
                    const st = manualOverrides[item.id] || 'normal';
                    container.innerHTML += `
                    <div class="staff-bus-item"><div class="staff-bus-row">
                        <span>🕒 <strong>${item.hotel}</strong></span>
                        <div class="btn-group">
                            <button class="staff-btn btn-normal ${st === 'normal' ? 'active' : ''}" onclick="setBusStatus(${item.id}, 'normal')">正常</button>
                            <button class="staff-btn btn-full ${st === 'full' ? 'active' : ''}" onclick="setBusStatus(${item.id}, 'full')">滿座</button>
                            <button class="staff-btn btn-out ${st === 'out' ? 'active' : ''}" onclick="setBusStatus(${item.id}, 'out')">停駛</button>
                        </div>
                    </div></div>`;
                }
            });
        }

        function setBusStatus(id, status) {
            let updates = { ...manualOverrides };
            if (status === 'normal') {
                delete updates[id];
            } else {
                updates[id] = status;
            }
            db.ref('busManualOverrides').set(updates);
        }
    </script>

</body>

</html>
