<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荃灣絲麗酒店 - 禮賓部員工後台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #eef2f7; color: #333; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-card {
            background: #fff; padding: 30px; border-radius: 16px; width: 100%; max-width: 360px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); text-align: center;
        }
        .login-card h2 { font-size: 18px; margin-bottom: 8px; color: #343a40; }
        .login-card p { font-size: 12px; color: #666; margin-bottom: 20px; }
        .login-card input {
            width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 8px; font-size: 14px; margin-bottom: 12px; text-align: center;
        }
        .login-card button {
            width: 100%; padding: 10px; background: #343a40; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .error-msg { color: #dc3545; font-size: 12px; margin-top: 8px; display: none; }

        .container { width: 100%; max-width: 700px; background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); overflow: hidden; display: none; }
        .header { background: #343a40; color: #fff; padding: 20px; text-align: center; }
        .header h1 { font-size: 18px; margin-bottom: 4px; }
        .header p { font-size: 12px; color: #adb5bd; }
        .section { padding: 20px; border-bottom: 1px solid #dee2e6; }
        .section:last-child { border-bottom: none; }
        h2 { font-size: 16px; color: #343a40; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        
        .staff-bus-item {
            background: #f8f9fa; border: 1px solid #ced4da; border-radius: 8px;
            padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 13px;
        }
        .staff-bus-row { display: flex; justify-content: space-between; align-items: center; }
        .btn-group { display: flex; gap: 6px; }
        .staff-btn {
            padding: 6px 10px; border: none; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: bold;
        }
        .btn-normal { background: #6c757d; color: white; }
        .btn-full { background: #dc3545; color: white; }
        .btn-out { background: #343a40; color: white; }
        .staff-btn.active { outline: 2px solid #000; box-shadow: 0 0 5px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h2>職員身分驗證</h2>
            <p>荃灣絲麗酒店 - 禮賓部後台</p>
            <input type="password" id="passwordInput" placeholder="請輸入員工密碼" onkeypress="handleKeyPress(event)">
            <button onclick="checkPassword()">登入後台</button>
            <div id="errorMsg" class="error-msg">密碼錯誤，請重新輸入！</div>
        </div>
    </div>

    <div class="container" id="mainContainer">
        <div class="header">
            <h1>荃灣絲麗酒店 - 禮賓部員工後台</h1>
            <p>Staff Management Console</p>
        </div>

        <div class="section">
            <h2>🚌 穿梭巴士即時狀態管理</h2>
            <div id="staffBusList"></div>
        </div>
    </div>

<script>
    const CORRECT_PASSWORD = "Stw3824";

    function checkPassword() {
        if (document.getElementById('passwordInput').value === CORRECT_PASSWORD) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            initDashboard();
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }
    function handleKeyPress(e) { if (e.key === 'Enter') checkPassword(); }

    const rawBusData = [
        { id: 1, hotel: "08:00", kMin: "08:15", tMin: "08:30" },
        { id: 2, hotel: "09:00", kMin: "09:15", tMin: "09:30" },
        { id: 3, hotel: "10:00", kMin: "10:15", tMin: "10:30" },
        { id: 4, hotel: "11:00", kMin: "11:15", tMin: "11:30" },
        { id: 5, hotel: "12:00", kMin: "12:15", tMin: "12:30" },
        { id: 6, hotel: "13:00 - 14:00", isBreak: true },
        { id: 7, hotel: "14:00", kMin: "14:15", tMin: "14:30" },
        { id: 8, hotel: "15:00", kMin: "15:15", tMin: "15:30" },
        { id: 9, hotel: "16:00", kMin: "16:15", tMin: "16:30" },
        { id: 10, hotel: "17:00", kMin: "17:15", tMin: "17:30" },
        { id: 11, hotel: "18:00", kMin: "18:15", tMin: "18:30" },
        { id: 12, hotel: "19:00", kMin: "19:15", tMin: "19:30" },
        { id: 13, hotel: "20:00", kMin: "20:15", tMin: "20:30" }
    ];

    function renderStaffBusList() {
        const container = document.getElementById('staffBusList');
        container.innerHTML = '';
        const overrides = JSON.parse(localStorage.getItem('busManualOverrides') || '{}');
        rawBusData.forEach(item => {
            if (item.isBreak) {
                container.innerHTML += `<div style="background: #fff3cd; color: #856404; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 12px; text-align: center;">🍽️ ${item.hotel} : 午飯時間</div>`;
            } else {
                const st = overrides[item.id] || 'NORMAL';
                container.innerHTML += `
                    <div class="staff-bus-item"><div class="staff-bus-row">
                        <span>🕒 <strong>${item.hotel}</strong></span>
                        <div class="btn-group">
                            <button class="staff-btn btn-normal ${st==='NORMAL'?'active':''}" onclick="setBusStatus(${item.id}, 'NORMAL')">正常</button>
                            <button class="staff-btn btn-full ${st==='FULL'?'active':''}" onclick="setBusStatus(${item.id}, 'FULL')">滿座</button>
                            <button class="staff-btn btn-out ${st==='OUT OF SVC'?'active':''}" onclick="setBusStatus(${item.id}, 'OUT OF SVC')">停駛</button>
                        </div>
                    </div></div>`;
            }
        });
    }

    function setBusStatus(id, status) {
        let overrides = JSON.parse(localStorage.getItem('busManualOverrides') || '{}');
        if (status === 'NORMAL') delete overrides[id]; else overrides[id] = status;
        localStorage.setItem('busManualOverrides', JSON.stringify(overrides));
        renderStaffBusList();
    }

    function initDashboard() {
        renderStaffBusList();
    }
</script>
</body>
</html>
